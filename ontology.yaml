# Онтология проекта «просветляющие агенты тканей»: классы, отношения, правила.
# Источник истины для графа проекта. По ней агент создаёт заметки классов в ontology/
# и проверяет связи заметок (AGENTS.md, раздел «Граф проекта»). Формат — practice.md.

ontology: clearing-agents
goal: >
  Записывать обзор и расчёты по оптическому просветлению тканей так, чтобы по графу
  проекта исследователь, агент и рецензент могли ответить: какой агент на какой ткани
  и в каких условиях испытан и в какой статье; какие числа (коэффициенты диффузии, β)
  получены, из какого файла и чем проверены; на какие статьи опирается обзор;
  какие задачи поставлены и чем закрыты.

competency_questions:
  - Какие просветляющие агенты на каких тканях испытаны, в каких условиях (in vivo / ex vivo) и каким методом контроля, в каких статьях описаны эти агенты и ткани и в каком файле лежат статья и запись эксперимента?
  - Какие числовые результаты (коэффициент диффузии, β(λ)) получены в каком эксперименте или расчёте, в каком файле они лежат и прошли ли проверку?
  - На каких наборах данных, по какой статье и каким кодом выполнены расчёт и его проверка и какие ограничения действуют на данные и результаты?
  - На какие статьи ссылается отчёт, какие эксперименты и результаты он описывает и какие статьи ещё не процитированы; какие работы найдены во внешних графах знаний, каким запросом и когда, кто их авторы и с какими агентами и тканями проекта они связаны?
  - Какие задачи поставлены, из каких подзадач состоят, в каком они статусе и что их закрыло — эксперимент, расчёт, проверка или отчёт?

classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, статья, данные, результат, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — опыт, расчёт, проверка
  Файл:
    parent: null
    definition: файл проекта — PDF статьи, таблица, код, текст; узел графа — сам файл, заметка о нём не нужна
  Ткань:
    parent: null
    definition: вид биологической ткани с указанием локализации; образец не отдельный класс
  ПросветляющийАгент:
    parent: null
    definition: вещество, которое наносят на ткань или вводят в неё, чтобы снизить рассеяние света; концентрация — свойство опыта, а не агента
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Статья:
    parent: ИнформационныйОбъект
    definition: опубликованная работа с DOI; PDF лежит в paper/ или paper/library/
  НаборДанных:
    parent: ИнформационныйОбъект
    definition: таблица или спектр, с которыми работает проект (data/…, review/table.csv)
  Результат:
    parent: ИнформационныйОбъект
    definition: число или зависимость с единицами и условиями, полученные в опыте или расчёте
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известный дефект данных или условие применимости результата 
  Отчет:
    parent: ИнформационныйОбъект
    definition: текст для коллег в review/ ; заметка отчета — сам файл
  Эксперимент:
    parent: Процесс
    definition: опыт или расчёт, который даёт результат
  Расчёт:
    parent: Процесс
    definition: вычисление, выполненное в проекте кодом из src/ по набору данных
  Проверка:
    parent: Процесс
    definition: независимая сверка результата другим способом — с таблицей статьи, по PDF, скриптом из checks/
  # --- Литература из внешних графов знаний (неделя 5) ------------------------------------
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, найденная во внешнем графе знаний (OpenAlex) и записанная по ответу инструмента; открытая версия, если скачана, — в literature/; в отличие от Статьи, PDF может не быть
  Автор:
    parent: null
    definition: человек — автор опубликованной работы, как он записан в ответе инструмента
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей

properties:
  подзадачаОт:     {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:          {domain: [Эксперимент, Расчёт, Проверка, ЗапросКГрафу], range: Задача}
  выполняет:       {domain: Отчет, range: Задача}
  описанВ:         {domain: [ПросветляющийАгент, Ткань], range: Статья}
  применяетАгент:  {domain: Эксперимент, range: ПросветляющийАгент}
  наТкани:         {domain: Эксперимент, range: Ткань}
  даёт:            {domain: [Эксперимент, Расчёт], range: Результат}
  использует:      {domain: Расчёт, range: НаборДанных}
  основанНа:       {domain: [Расчёт, Проверка], range: Статья}
  проверенЧерез:   {domain: Результат, range: Проверка}
  ограничивает:    {domain: Ограничение, range: [НаборДанных, Результат]}
  описывает:       {domain: Отчет, range: [Эксперимент, Результат]}
  ссылаетсяНа:     {domain: Отчет, range: Статья}
  хранитсяВ:       {domain: [Статья, Источник, НаборДанных, Результат, Эксперимент], range: Файл}
  реализованВ:     {domain: [Расчёт, Проверка], range: Файл}
  # литература из внешних графов
  найденЗапросом:  {domain: Источник, range: ЗапросКГрафу}
  написан:         {domain: Источник, range: Автор}
  цитирует:        {domain: Источник, range: Источник}
  соответствует:   {domain: Источник, range: Статья}
  изученВ:         {domain: [ПросветляющийАгент, Ткань], range: Источник}

# Атрибуты — свойства со значением из списка (в заметке — поле в начале файла).
attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  условия:
    domain: Эксперимент
    values: [in vivo, ex vivo, in vitro]
  методКонтроля:
    domain: Эксперимент
    values: [ОКТ, спектроскопия отражения, коллимированное пропускание, другой]
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]


rules:
  # --- Агент и ткань должны иметь источник -------------------------------------------
  - id: П1
    text: Каждый просветляющий агент описан хотя бы в одной статье — агент без источника в граф не вносится.
    dl: "ПросветляющийАгент ⊑ ∃описанВ.Статья"
    check: {kind: some, class: ПросветляющийАгент, property: описанВ, target: Статья}
  - id: П2
    text: Каждая ткань описана хотя бы в одной статье.
    dl: "Ткань ⊑ ∃описанВ.Статья"
    check: {kind: some, class: Ткань, property: описанВ, target: Статья}
  - id: П3
    text: У каждой статьи есть PDF в проекте — работу без файла не цитируют (AGENTS.md, запрет 1).
    dl: "Статья ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: Статья, property: хранитсяВ, target: Файл}
  - id: П4
    text: В каждом эксперименте применяется хотя бы один агент.
    dl: "Эксперимент ⊑ ∃применяетАгент.ПросветляющийАгент"
    check: {kind: some, class: Эксперимент, property: применяетАгент, target: ПросветляющийАгент}
  - id: П5
    text: Каждый эксперимент выполнен хотя бы на одной ткани.
    dl: "Эксперимент ⊑ ∃наТкани.Ткань"
    check: {kind: some, class: Эксперимент, property: наТкани, target: Ткань}
  - id: П6
    text: Цитируемая статья — статья, на которую ссылается хотя бы один отчёт; остальные статьи из paper/library/ в отчёт ещё не вошли.
    dl: "ЦитируемаяСтатья ≡ Статья ⊓ ∃ссылаетсяНа⁻.⊤"
    check: {kind: defined_inverse, name: ЦитируемаяСтатья, class: Статья, properties: [ссылаетсяНа]}
  # --- Задачи ---------------------------------------------------------------------------
  - id: П7
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, attribute: status, values: [выполнена, принята]}
  - id: П8
    text: Задача выполнена, только если выполнены все её подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П9
    text: В заметке выполненной задачи есть раздел «Итог» — что сделано и чем проверено.
    dl: "— (правило оформления, проверяется по тексту заметки)"
    check: {kind: section, class: ВыполненнаяЗадача, section: Итог}
  # --- Литература из внешних графов ----------------------------------------------------
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
    check: {kind: some, class: Источник, property: найденЗапросом, target: ЗапросКГрафу}
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
    check: {kind: some, class: Источник, property: написан, target: Автор}
